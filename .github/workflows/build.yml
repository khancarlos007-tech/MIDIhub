name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Generar fitxers de l'app
        run: bash setup.sh
      - name: Instal·lar Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o gradle.zip
          unzip -q gradle.zip
      - name: Acceptar llicències Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compilar
        run: ./gradle-8.2/bin/gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: MidiPatch-apk, path: app/build/outputs/apk/debug/*.apk }
